name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Validate test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest -q

  build-exe:
    name: Build ipinsight.exe (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm ipinsight.spec
          if (-not (Test-Path .\dist\ipinsight.exe)) {
            throw "Executable dist\ipinsight.exe introuvable apres le build."
          }

      - name: Smoke test ipinsight.exe
        run: |
          python - << 'EOF'
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          from tests.mmdb_writer import build_mmdb, city_record

          exe = Path("dist/ipinsight.exe")
          assert exe.is_file(), f"Executable introuvable : {exe}"

          def run_exe(*args):
              proc = subprocess.run(
                  [str(exe), *args],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
              return proc

          v = run_exe("--version")
          assert v.returncode == 0, f"--version a echoue ({v.returncode}): {v.stderr}"
          assert "IPInsight CLI 1.2.0" in v.stdout, v.stdout

          h = run_exe("--help")
          assert h.returncode == 0, f"--help a echoue ({h.returncode}): {h.stderr}"
          assert "--rdap" in h.stdout and "--output" in h.stdout

          d = run_exe("--disclaimer", "--no-color")
          assert d.returncode == 0, f"--disclaimer a echoue ({d.returncode}): {d.stderr}"

          priv = run_exe("--ip", "192.168.1.1", "--json")
          assert priv.returncode == 3, f"Code inattendu ({priv.returncode}): {priv.stderr}"
          assert json.loads(priv.stdout)["ip_scope"] == "private"

          with tempfile.TemporaryDirectory() as tmp:
              mmdb_path = Path(tmp) / "test.mmdb"
              out_path = Path(tmp) / "report.json"
              mmdb_path.write_bytes(
                  build_mmdb(
                      [("8.8.8.0/24", city_record(48.8566, 2.3522, country="France", iso="FR", city="Paris"))],
                      database_type="DBIP-City-Lite",
                  )
              )
              off = run_exe("--ip", "8.8.8.8", "--offline", "--mmdb", str(mmdb_path), "--json", "-o", str(out_path))
              assert off.returncode == 0, f"Offline a echoue ({off.returncode}): {off.stderr}"
              payload = json.loads(off.stdout)
              assert payload["city"] == "Paris" and payload["offline"] is True
              assert json.loads(out_path.read_text(encoding="utf-8"))["city"] == "Paris"

          print("Smoke test ipinsight.exe OK")
          EOF

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\ipinsight.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ipinsight.exe" | Out-File -FilePath .\dist\ipinsight.exe.sha256 -Encoding ascii
          Get-Content .\dist\ipinsight.exe.sha256

      - name: Upload ipinsight.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipinsight-windows-x64
          path: |
            dist/ipinsight.exe
            dist/ipinsight.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ipinsight.exe
            dist/ipinsight.exe.sha256
          generate_release_notes: true
